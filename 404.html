<title>Siempre Mate</title>
<meta name="robots" content="noindex">
<script>
  // un enlace de producto que todavía no tiene su página (/p/nombre/) lleva igual al producto en la tienda
  var m = location.pathname.match(/^(.*?)\/p\/([^\/]+)/);
  location.replace(m ? m[1] + '/#' + m[2] : '/');
</script>
